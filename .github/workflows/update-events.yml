name: Update events & deploy site

on:
  schedule:
    - cron: "17 10 * * *" # daily, ~5 AM Chicago time
  workflow_dispatch:
  push:
    branches: [master]
    paths: ["site/**", "pipeline/**", ".github/workflows/update-events.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover tests

      - name: Collect events
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
        run: python -m pipeline.build

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898728+github-actions[bot]@users.noreply.github.com"
          git add site/data/events.json pipeline/cache
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh event data ($(date -u +%Y-%m-%d))"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
